name: build
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: false
env:
   MAVEN_OPTS: -Xmx1g
jobs:
   build:
      runs-on: ubuntu-latest
      steps:
      -  uses: actions/checkout@v6
      -  name: Set up JDK
         uses: actions/setup-java@v4
         with:
            distribution: 'zulu'
            java-version: |
              17
              21
      -  name: Cache SonarCloud packages
         uses: actions/cache@v5
         with:
            path: ~/.sonar/cache
            key: ${{ runner.os }}-sonar
            restore-keys: ${{ runner.os }}-sonar
      -  name: Cache Maven packages
         uses: actions/cache@v5
         with:
            path: ~/.m2
            key: ${{ runner.os }}-m2-${{ hashFiles('/pom.xml') }}
            restore-keys: ${{ runner.os }}-m2
      -  name: maven-settings-xml-action
         uses: s4u/maven-settings-action@v4.0.0
         with:
           repositories: '[{ "id": "repository.spring.milestone", "url": "https://repo.spring.io/milestone" }]'
           pluginRepositories: '[{ "id": "repository.spring.milestone", "url": "https://repo.spring.io/milestone" }]'
      -  name: Build with Maven
         run: mvn --batch-mode clean verify -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      -  uses: codecov/codecov-action@v4
         env:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      -  name: Analyse
         env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
         run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.organization=doudouchat -Dsonar.projectKey=doudouchat_exemple-ai -Dsonar.host.url=https://sonarcloud.io -Dsonar.java.enablePreview=true
